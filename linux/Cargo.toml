[package]
name = "praxis-scanner-linux"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Native Linux network scanner built with Rust, GTK4 and libadwaita"
license = "GPL-3.0-only"

[dependencies]
gtk = { package = "gtk4", version = "0.11.5" }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_4"] }
nix = { version = "0.31.3", features = ["net"] }
mdns-sd = { version = "0.21.7", default-features = false }
socket2 = "0.6.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
