[package]
name = "praxis-scanner-linux"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Native Linux network scanner built with Rust, GTK4 and libadwaita"
license = "GPL-3.0-only"

[dependencies]
gtk = { package = "gtk4", version = "0.11.5" }
adw = { package = "libadwaita", version = "0.9.2" }
nix = { version = "0.31.3", features = ["net"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
