name: Linux application CI

on:
  push:
    branches:
      - linux/gtk4-port-planning
    paths:
      - "linux/**"
      - "io.github.praxis1071.PraxisScanner.yml"
      - ".github/workflows/linux-ci.yml"
  pull_request:
    paths:
      - "linux/**"
      - "io.github.praxis1071.PraxisScanner.yml"
      - ".github/workflows/linux-ci.yml"

permissions:
  contents: read

concurrency:
  group: linux-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Format, build, tests and lint
    permissions:
      contents: write
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Generate dependency lockfile when missing
        run: |
          if [ ! -f linux/Cargo.lock ]; then
            cargo generate-lockfile --manifest-path linux/Cargo.toml
          else
            echo "Using the committed Cargo.lock."
          fi

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: linux -> linux/target

      - name: Format and verify Rust sources
        run: |
          cargo fmt --manifest-path linux/Cargo.toml --all
          cargo fmt --manifest-path linux/Cargo.toml --all -- --check

      - name: Install GTK build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=45 -o Acquire::https::Timeout=45 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=45 -o Acquire::https::Timeout=45 install -y --no-install-recommends build-essential pkg-config libgtk-4-dev libadwaita-1-dev
          pkg-config --modversion gtk4 libadwaita-1

      - name: Run unit and integration tests
        run: cargo test --manifest-path linux/Cargo.toml --all-targets --locked

      - name: Run Clippy
        run: cargo clippy --manifest-path linux/Cargo.toml --all-targets --locked -- -D warnings

      - name: Build release binary
        run: cargo build --manifest-path linux/Cargo.toml --release --locked

      - name: Generate offline Flatpak Cargo sources
        run: |
          python3 -m venv /tmp/flatpak-cargo-generator
          /tmp/flatpak-cargo-generator/bin/pip install --disable-pip-version-check "aiohttp>=3.9.5,<4.0.0" "tomlkit>=0.13.3,<1.0"
          curl --fail --location --retry 3 --output /tmp/flatpak-cargo-generator.py https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/9d86d336a39b9af38b86f114b6ce5820fe260f91/cargo/flatpak-cargo-generator.py
          /tmp/flatpak-cargo-generator/bin/python /tmp/flatpak-cargo-generator.py linux/Cargo.lock --output linux/cargo-sources.json

      - name: Publish reproducible Flatpak build inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: praxis-scanner-flatpak-sources
          path: |
            linux/Cargo.lock
            linux/cargo-sources.json
          if-no-files-found: error
          retention-days: 7

      - name: Commit generated Flatpak dependency sources
        if: github.event_name == 'push' && github.ref == 'refs/heads/linux/gtk4-port-planning'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linux/src linux/Cargo.lock linux/cargo-sources.json
          if git diff --cached --quiet; then
            echo "Flatpak dependency sources are already up to date."
          else
            git commit -m "build(linux): pin Rust dependencies for Flatpak"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  flatpak:
    name: Validate metadata and build Flatpak
    needs: linux
    permissions:
      contents: read
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download reproducible Cargo sources
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: praxis-scanner-flatpak-sources
          path: linux

      - name: Install Flatpak build tools
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=45 -o Acquire::https::Timeout=45 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=45 -o Acquire::https::Timeout=45 install -y --no-install-recommends flatpak flatpak-builder appstream desktop-file-utils

      - name: Validate desktop integration metadata
        run: |
          appstreamcli validate --no-net linux/data/io.github.praxis1071.PraxisScanner.metainfo.xml
          desktop-file-validate linux/data/io.github.praxis1071.PraxisScanner.desktop

      - name: Install GNOME 50 runtime and Rust SDK extension
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive --assumeyes flathub org.gnome.Platform//50 org.gnome.Sdk//50 org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Build sandboxed application
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse --install-deps-from=flathub --repo=repo build-dir io.github.praxis1071.PraxisScanner.yml
