name: Linux application CI

on:
  push:
    branches:
      - linux/gtk4-port-planning
    paths:
      - "linux/**"
      - ".github/workflows/linux-ci.yml"
  pull_request:
    paths:
      - "linux/**"
      - ".github/workflows/linux-ci.yml"

permissions:
  contents: read

concurrency:
  group: linux-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    timeout-minutes: 20
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install GTK build dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-4-dev libadwaita-1-dev
          pkg-config --modversion gtk4 libadwaita-1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path linux/Cargo.toml --all -- --check
      - name: Run unit tests
        run: cargo test --manifest-path linux/Cargo.toml --all-targets
      - name: Run Clippy
        run: cargo clippy --manifest-path linux/Cargo.toml --all-targets -- -D warnings
      - name: Build release binary
        run: cargo build --manifest-path linux/Cargo.toml --release
